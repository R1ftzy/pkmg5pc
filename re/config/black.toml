# Per-title recompilation config for black.
#
# Addresses and reasoning only: no ROM bytes and no dump fingerprints.
# Generated by tools/stage_title_config.py from a local coverage
# ingest; regenerate with pkmn_bankgen after a new ingest.

[title]
id = "black"
seed_dir = "black/seeds"

# Every load base a bank must exist for. A base is
# guest_span_start - module_span_start in the finding, so the same
# image is recompiled again at each base; no dumped bytes are involved.

[[alias]]
cpu          = "arm7"
image        = "arm7.bin"
load_address = 0x02FCE5A8
declared     = 0x02380000
pages        = 11
guest_span   = "0x02FE0000..0x02FF7000"
module_span  = "0x11A58..0x28A58"
note         = "resident at a base no bank declares; recompile the module at this base, no dumped bytes required"

[[alias]]
cpu          = "arm7"
image        = "arm7.bin"
load_address = 0x037F79BC
declared     = 0x02380000
pages        = 14
guest_span   = "0x037F8000..0x03809000"
module_span  = "0x644..0x11644"
note         = "resident at a base no bank declares; recompile the module at this base, no dumped bytes required"

[seeds]
