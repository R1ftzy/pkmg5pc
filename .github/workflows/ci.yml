name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.preset }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        preset: [linux, windows]
        config: [debug, release]
        exclude:
          - os: ubuntu-latest
            preset: windows
          - os: windows-latest
            preset: linux
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}-${{ matrix.config }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.config }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}-${{ matrix.config }}
